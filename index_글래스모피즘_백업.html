<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>브릿지 커피 메뉴판</title>

  <style>
    /* ===== 색깔 설정 (색을 바꾸고 싶으면 여기 두 줄만 고치세요) ===== */
    :root {
      --brown: #4A3728;   /* 짙은 갈색: 배경, 제목 */
      --cream: #F5EFE6;   /* 크림색: 카드, 본문 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      /* 글꼴: 고운 돋움을 먼저 쓰고, 없으면 맑은 고딕을 씁니다 */
      font-family: "고운 돋움", "GowunDodum", "Gowun Dodum", "맑은 고딕", "Malgun Gothic", sans-serif;
      background: var(--brown);
      /* 은은한 빛 번짐: 유리 카드가 더 예쁘게 보이게 해줍니다 */
      background-image:
        radial-gradient(circle at 15% 10%, rgba(245, 239, 230, 0.18), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(245, 239, 230, 0.12), transparent 50%);
      background-attachment: fixed;
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    /* 휴대폰 화면(390px)에 맞춘 가운데 영역 */
    .page {
      width: 100%;
      max-width: 390px;
      padding: 40px 20px 32px;
    }

    /* 유리 느낌 카드 (반투명 + 부드러운 그림자 + 둥근 모서리) */
    .glass {
      background: rgba(245, 239, 230, 0.14);
      border: 1px solid rgba(245, 239, 230, 0.28);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* ===== 1. 맨 위: 가게 이름과 소개 ===== */
    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 30px; letter-spacing: 1px; margin-bottom: 10px; }
    header p { font-size: 15px; opacity: 0.85; }

    /* ===== 2. 가운데: 메뉴 목록 ===== */
    .menu-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 28px; }
    .menu-item { padding: 18px 20px; }
    .menu-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 6px;
    }
    .menu-name { font-size: 18px; font-weight: bold; }
    .menu-price { font-size: 16px; white-space: nowrap; }
    .menu-desc { font-size: 14px; opacity: 0.8; line-height: 1.5; }

    /* ===== 3. 맨 아래: 영업시간과 전화 버튼 ===== */
    footer { padding: 22px 20px; text-align: center; }
    footer h2 { font-size: 16px; margin-bottom: 10px; }
    .hours { font-size: 14px; line-height: 1.8; opacity: 0.9; margin-bottom: 18px; }

    .call-button {
      display: block;
      padding: 14px;
      border-radius: 14px;
      background: var(--cream);
      color: var(--brown);
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    .call-button:active { transform: scale(0.98); }
  </style>
</head>

<body>
  <div class="page">

    <!-- ===== 1. 맨 위: 가게 이름과 한 줄 소개 =====
         가게 이름이나 소개를 바꾸려면 아래 글자만 고치세요. -->
    <header>
      <h1>브릿지 커피</h1>
      <p>매일 직접 볶는 스페셜티 커피</p>
    </header>

    <!-- ===== 2. 가운데: 메뉴 목록 =====
         메뉴 하나는 아래처럼 <div class="menu-item glass"> ... </div> 한 덩어리입니다.
         - 메뉴를 추가하려면: 덩어리 하나를 통째로 복사해서 아래에 붙여 넣으세요.
         - 메뉴를 지우려면: 덩어리 하나를 통째로 지우세요.
         - 바꿀 곳: 메뉴 이름 / 가격 / 한 줄 설명 (글자만 고치면 됩니다)
         지금 3개는 예시입니다. -->
    <main class="menu-list">

      <div class="menu-item glass">
        <div class="menu-top">
          <span class="menu-name">아메리카노</span>
          <span class="menu-price">4,500원</span>
        </div>
        <p class="menu-desc">산미가 적은 고소한 원두</p>
      </div>

      <div class="menu-item glass">
        <div class="menu-top">
          <span class="menu-name">아인슈페너</span>
          <span class="menu-price">5,800원</span>
        </div>
        <p class="menu-desc">단맛을 줄인 수제 크림</p>
      </div>

      <div class="menu-item glass">
        <div class="menu-top">
          <span class="menu-name">흑임자 라떼</span>
          <span class="menu-price">5,500원</span>
        </div>
        <p class="menu-desc">국산 흑임자를 직접 갈아 넣음</p>
      </div>

    </main>

    <!-- ===== 3. 맨 아래: 영업시간과 전화 걸기 버튼 =====
         영업시간은 글자만 고치면 됩니다.
         전화번호는 아래 href="tel:..." 부분에 숫자만(하이픈 없이) 넣으세요. -->
    <footer class="glass">
      <h2>영업시간</h2>
      <p class="hours">
        평일 08:00 - 21:00<br>
        주말 10:00 - 20:00<br>
        목요일 휴무
      </p>
      <a class="call-button" href="tel:0620000000">전화 걸기 062-000-0000</a>
    </footer>

  </div>
</body>
</html>
